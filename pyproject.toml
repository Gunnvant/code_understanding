[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etl-local"
version = "0.2.0"
description = "Pipeline ETL local: CSV/Excel/JSON/Parquet/HTTP -> validação -> Postgres/SQLite/Parquet"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandera>=0.18",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
    "requests>=2.31",
    "dnspython>=2.6",
    "apscheduler>=3.10",
    "streamlit>=1.32",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
etl = "etl.cli:app"

[tool.setuptools.packages.find]
include = ["etl*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
